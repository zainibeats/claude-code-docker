services:
  contagent:
    build:
      context: .
      args:
        ## Switch providers from .env instead of editing the Dockerfile.
        AGENT_PACKAGES: ${AGENT_PACKAGES:-@anthropic-ai/claude-code}
    image: contagent:local
    ## The workspace is mounted at its host path so that paths inside the
    ## container mean the same thing to the host Docker daemon. Without this,
    ## `docker run -v $(pwd):/app` from inside the container silently mounts a
    ## non-existent host directory.
    working_dir: ${PATH_TO_WORKSPACE:?set PATH_TO_WORKSPACE in .env}
    volumes:
      ## Replace with the directory you want the agent to access, via .env
      - ${PATH_TO_WORKSPACE:?set PATH_TO_WORKSPACE in .env}:${PATH_TO_WORKSPACE}
      ## Agent credentials, settings, project history, and shell history live
      ## here. Without this volume every session starts logged out.
      - agent-home:/home/agent
      ## Allow the agent to run Docker commands through the host Docker daemon
      - /var/run/docker.sock:/var/run/docker.sock
      ## SSH agent forwarding, so `git push` over SSH works without copying
      ## private keys into the container. Falls back to /dev/null when the host
      ## has no agent running; the entrypoint detects that and unsets the var.
      ## On macOS use SSH_AUTH_SOCK=/run/host-services/ssh-auth.sock in .env.
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
    environment:
      - WORKSPACE=${PATH_TO_WORKSPACE}
      ## Run `id -u` / `id -g` on the host and set these in .env. Note that $UID
      ## is not exported by the shell, so it cannot be read here automatically.
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - AGENT_USER=${AGENT_USER:-agent}
      - AGENT_SUDO=${AGENT_SUDO:-1}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - SSH_AUTH_SOCK=/ssh-agent
      ## Terminal fidelity: without these, colours and timestamps differ from
      ## the host terminal the container was launched from.
      - TERM=${TERM:-xterm-256color}
      - COLORTERM=${COLORTERM:-}
      - TZ=${TZ:-UTC}
      ## Provider credentials. `docker compose run` does not inherit host
      ## environment, so anything the agent needs has to be listed explicitly.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GH_TOKEN=${GH_TOKEN:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    ## Reap orphaned processes from long-running agent sessions.
    init: true
    tty: true
    stdin_open: true

volumes:
  agent-home:

networks:
  ## Pin the bridge subnet instead of letting Docker pick one. Docker's default
  ## pool starts at 172.17.0.0/16 and walks up through 172.31, which is inside
  ## RFC1918 space that hotel, conference, and corporate WiFi hand out to
  ## clients. When the container subnet overlaps the LAN, the container's own
  ## address falls inside the LAN prefix, so the host's longest-prefix match
  ## sends reply packets out the physical interface instead of back into the
  ## bridge. Traffic leaves, nothing returns, and every connection times out --
  ## which looks exactly like a captive portal or a blocked API endpoint.
  ## Override DOCKER_SUBNET in .env if this range clashes with a network you use.
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-10.213.7.0/24}
