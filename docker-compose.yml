services:
  contagent:
    ## Option 1: Build image from source
    build: .
    ## Option 2: Pull image from Dockerhub
    ## Tag Options: "claude-4.7" or "codex-5.5"
    # image: skimming124/contagent:claude-4.7
    container_name: contagent
    working_dir: /workspace
    volumes:
      ## Replace with the directory you want the agent to access
      - ${PATH_TO_WORKSPACE}:/workspace
      ## Allow the agent to run Docker commands through the host Docker daemon
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - HOST_UID=${UID:-1000}
      - HOST_GID=${GID:-${UID:-1000}}
      - AGENT_USER=${AGENT_USER:-agent}
      - DOCKER_HOST=unix:///var/run/docker.sock
    cap_add:
      ## Allows Bubblewrap-based agent sandboxes, including Codex, to create namespaces
      - SYS_ADMIN
    security_opt:
      ## Docker's default seccomp/AppArmor profiles can block nested sandbox setup
      - seccomp=unconfined
      - apparmor=unconfined
    tty: true
    stdin_open: true
